<section class="admin-shell">
  <aside class="admin-sidebar">
    <a routerLink="/" class="brand-block" aria-label="Go to ZivaFit store">
      <span>ZivaFit</span>
    </a>

    <div class="admin-profile">
      <div class="admin-avatar">{{ adminInitial }}</div>

      <div>
        <strong>{{ adminName }}</strong>
        <span>Administrator</span>
      </div>

      <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </div>

    <nav class="admin-nav" aria-label="Admin navigation">
      <div class="nav-group">
        <p>Store Front</p>

        <a
          *ngFor="let link of storeFrontLinks"
          [routerLink]="link.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.route === '/admin/dashboard' }"
        >
          <i [class]="link.iconClass" aria-hidden="true"></i>
          <span>{{ link.label }}</span>
        </a>
      </div>

      <div class="nav-group">
        <p>Management</p>

        <a
          *ngFor="let link of managementLinks"
          [routerLink]="link.route"
          routerLinkActive="active"
        >
          <i [class]="link.iconClass" aria-hidden="true"></i>
          <span>{{ link.label }}</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/admin/settings" routerLinkActive="active">
        <i class="bi bi-gear" aria-hidden="true"></i>
        <span>Settings</span>
      </a>

      <button type="button" (click)="logout()">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>
</section>
