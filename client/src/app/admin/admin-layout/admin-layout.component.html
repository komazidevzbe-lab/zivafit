      <span>ZivaFit</span>
      <small>STORE ADMIN</small>
    </a>

    <nav>
      <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/admin/home-management" routerLinkActive="active">Home Management</a>
      <a routerLink="/admin/product-management" routerLinkActive="active">Product Management</a>
