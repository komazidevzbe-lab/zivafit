<section class="auth-page">
  <div class="auth-visual">
    <p class="eyebrow">Welcome back</p>
    <h1>Move with confidence.</h1>
    <p>Log in to manage your wishlist, checkout, orders, and ZivaFit account.</p>
  </div>

  <div class="auth-card">
    <h2>Login</h2>
    <p class="auth-subtitle">Use your email and password.</p>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label>Email</label>
        <input
          name="email"
          type="email"
          class="form-control"
          [(ngModel)]="model.email"
          autocomplete="email"
          required
        />
        <div class="ziva-form-error" *ngIf="emailError">{{ emailError }}</div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-row">
          <input
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="model.password"
            autocomplete="current-password"
            required
          />
          <button type="button" (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div class="ziva-form-error" *ngIf="passwordError">{{ passwordError }}</div>
      </div>

      <div class="ziva-form-error" *ngIf="generalError">{{ generalError }}</div>

      <button class="ziva-btn-dark w-100" type="submit">Login</button>
    </form>

    <div class="auth-links">
      <a routerLink="/forgot-password">Forgot password?</a>
      <span>New to ZivaFit?</span>
      <a routerLink="/signup">Create account</a>
    </div>
  </div>
</section>
