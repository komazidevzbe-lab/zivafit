<section class="auth-page">
  <div class="auth-visual">
    <p class="eyebrow">Password help</p>
    <h1>Reset your password securely.</h1>
    <p>Enter your account email and we will send you a reset code.</p>
  </div>

  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="auth-subtitle">We will email you a reset code.</p>

    <form (ngSubmit)="sendResetCode()" #forgotForm="ngForm">
      <div class="form-group">
        <label>Email</label>
        <input
          name="email"
          type="email"
          class="form-control"
          [(ngModel)]="model.email"
          required
        />
        <div class="ziva-form-error" *ngIf="emailError">{{ emailError }}</div>
      </div>

      <div class="ziva-form-error" *ngIf="generalError">{{ generalError }}</div>
      <div class="ziva-form-success" *ngIf="successMessage">{{ successMessage }}</div>

      <button class="ziva-btn-dark w-100" type="submit">Send Reset Code</button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Back to login</a>
    </div>
  </div>
</section>
